
name: CI

on: 
  push: 
    branches: [main]
  pull_request: 
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Intall dependamcies
        run: npm run build

        env: 
          NODE_ENV: test
          GEMINI_API_KEY: dummy-test-key
          REDIS_URL: 'redis://localhost:6379'
          DEFAULT_MONTHLY_BUDGET_USD: '100'
          SOFT_LIMIT_THRESHOLD_RATIO: '0.5'
          PROXY_KEY: dummy-proxy-key
