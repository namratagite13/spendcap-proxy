
name: CI

on: 
  push: 
    branches: [main]
  pull_request: 
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379: 6379

        options: >-
           --health-cmd "redis-cli ping"
           --health-interval 10s
           --health-timeout 5s
           --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Intall dependencies
        run: npm install

      - name: Run dev
        run: npm run dev

      - name: run tests
        run: npm test

        env: 
          NODE_ENV: test
          GEMINI_API_KEY: dummy-test-key
          REDIS_URL: 'redis://localhost:6379'
          DEFAULT_MONTHLY_BUDGET_USD: '100'
          SOFT_LIMIT_THRESHOLD_RATIO: '0.5'
          PROXY_KEY: dummy-proxy-key
